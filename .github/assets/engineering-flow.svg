<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 72" role="img" aria-labelledby="title description">
  <title id="title">Animated engineering flow</title>
  <desc id="description">Blue particles move across a subtle engineering workflow line.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#0EA5E9" stop-opacity="0" />
      <stop offset=".18" stop-color="#38BDF8" stop-opacity=".8" />
      <stop offset=".82" stop-color="#38BDF8" stop-opacity=".8" />
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="960" height="72" rx="18" fill="#03192A" />
  <path d="M72 36H888" stroke="url(#line)" stroke-width="2" />
  <g fill="#38BDF8">
    <circle cx="192" cy="36" r="5" />
    <circle cx="480" cy="36" r="5" />
    <circle cx="768" cy="36" r="5" />
  </g>
  <g fill="#E0F2FE">
    <circle r="4">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M72 36H888" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3">
      <animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="M72 36H888" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="-2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
