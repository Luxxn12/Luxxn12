name: Generate contribution snake

on:
  # Generate immediately when this workflow changes, then refresh every day.
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate and publish snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: contribution-snake
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Generates light and dark SVGs from this profile's contribution graph.
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Luxxn12
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publishes only the generated SVGs to `output`, which README.md loads.
      - name: Publish animation to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: "chore: update contribution snake"
